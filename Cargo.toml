[package]
name = "hotwire-signal-generator"
version = "1.1.0"
edition = "2021"
description = "HotWire Signal Generator — Dual-Channel DDS Waveform, Hardware PWM, Frequency Sweep & 4-Ch Digital Pattern Generator in Rust/WASM (Leptos) for Seeed Studio XIAO ESP32-S3 & ESP32-C6"
license = "Apache-2.0"

[dependencies]
hotwire-core = { git = "https://github.com/hotwire-lab/hotwire-core", tag = "v0.6.0" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "Performance",
  "TextMetrics",
  "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
